name: Drive to Terabox Auto Upload

on:
  schedule:
    # Her ayın 1. günü saat 00:00 UTC'de çalıştır
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:
  upload-to-terabox:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests google-auth-oauthlib google-auth-httplib2 google-api-python-client
    
    - name: Run upload script
      env:
        TERABOX_TOKEN: ${{ secrets.TERABOX_ACCESS_TOKEN }}
        GOOGLE_DRIVE_FOLDER: '/content/drive/MyDrive/twitter_monitoring_images'
        TERABOX_FOLDER: '/twitter_monitoring_images'
      run: python drive_to_terabox.py
